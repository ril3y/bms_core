name: bms_core
description: Shared building blocks for Bluetooth battery (BMS) drivers - driver base classes, advertisement matching, data model, Modbus RTU, BLE plumbing.
version: 0.1.0
publish_to: none
repository: https://github.com/ril3y/bms_core
topics: [bluetooth, ble, bms, battery, modbus]

environment:
  sdk: ^3.13.5
  flutter: ">=1.17.0"

dependencies:
  flutter:
    sdk: flutter
  universal_ble: ^3.1.2
  modbus_ble:
    git:
      url: https://github.com/ril3y/modbus_ble.git
      ref: main

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
